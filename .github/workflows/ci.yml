name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # bước nào treo thì fail sớm, không chờ 6 tiếng
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres  # mật khẩu của container dùng một lần trong CI, không phải secret
        ports:
          - 5432:5432
        # Chờ Postgres nhận kết nối rồi mới chạy pytest.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # bước nào treo thì fail sớm, không chờ 6 tiếng
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install and run Gitleaks
        run: |
          VER=8.24.0
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          curl -sSLO "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_checksums.txt"
          grep linux_x64.tar.gz "gitleaks_${VER}_checksums.txt" | sha256sum -c -
          sudo tar -xzf "gitleaks_${VER}_linux_x64.tar.gz" -C /usr/local/bin gitleaks
          gitleaks detect --verbose --redact
