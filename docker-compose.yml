services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Điền POSTGRES_PASSWORD trong .env (xem .env.example)}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  miniweb:
    image: python:3.12-slim
    working_dir: /repo
    volumes:
      - ./evals:/repo/evals:ro
    ports:
      - "127.0.0.1:8800:8800"
    command:
      - sh
      - -c
      - pip install --no-cache-dir fastapi uvicorn pyyaml
        && uvicorn evals.miniweb.server:app --host 0.0.0.0 --port 8800

volumes:
  pgdata:
